---
- name: Déploiement ClamAV Automation (scan + timers systemd)
  hosts: all
  become: yes
  become_method: sudo
  become_user: root
  become_flags: '-H'

  vars:
    ansible_remote_tmp: /tmp/.ansible

  environment:
    ANSIBLE_REMOTE_TMP: /tmp/.ansible
    ANSIBLE_LOCAL_TMP: /tmp/.ansible
    ANSIBLE_HOST_KEY_CHECKING: "False"

  tasks:

    # ------------------------------------------------------------------
    # ANSIBLE TMP (OBLIGATOIRE POUR SEMAPHORE)
    # ------------------------------------------------------------------
    - name: Créer dossier temp Ansible
      file:
        path: /tmp/.ansible
        state: directory
        mode: '0777'

    # ------------------------------------------------------------------
    # INSTALLATION CLAMAV
    # ------------------------------------------------------------------
    - name: Installer ClamAV
      apt:
        name:
          - clamav
          - clamav-daemon
        state: present
        update_cache: yes

    # ------------------------------------------------------------------
    # DOSSIERS CLAMAV
    # ------------------------------------------------------------------
    - name: Créer les dossiers ClamAV
      file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
      loop:
        - { path: /opt/clamav/scripts, owner: root,   group: root,   mode: '0755' }
        - { path: /var/log/clamav,     owner: clamav, group: clamav, mode: '0750' }

    # ------------------------------------------------------------------
    # SCRIPTS
    # ------------------------------------------------------------------
    - name: Copier les scripts ClamAV
      copy:
        src: "{{ item }}"
        dest: /opt/clamav/scripts/
        owner: root
        group: root
        mode: '0755'
      loop:
        - scripts/clamav_scan.sh
        - scripts/clamav_update.sh

    # ------------------------------------------------------------------
    # LOGS
    # ------------------------------------------------------------------
    - name: Créer les fichiers de log ClamAV
      file:
        path: "{{ item.path }}"
        state: touch
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
      loop:
        - { path: /var/log/clamav/freshclam.log,    owner: clamav, group: clamav, mode: '0640' }
        - { path: /var/log/clamav/clamav-scan.log, owner: root,   group: root,   mode: '0600' }

    # ------------------------------------------------------------------
    # CONFIGURATION CLAMAV (EXCLUSIONS SOC)
    # ------------------------------------------------------------------
    - name: Ajouter exclusions ClamAV
      lineinfile:
        path: /etc/clamav/clamd.conf
        line: "{{ item }}"
        state: present
      loop:
        - 'ExcludePath ^/opt/Shuffle'
        - 'ExcludePath ^/var/opt/kaspersky'
        - 'ExcludePath ^/proc'
        - 'ExcludePath ^/sys'
        - 'ExcludePath ^/dev'
        - 'ExcludePath ^/var/log'

    # ------------------------------------------------------------------
    # SYSTEMD SERVICES
    # ------------------------------------------------------------------
    - name: Installer services systemd ClamAV
      copy:
        src: "{{ item }}"
        dest: /etc/systemd/system/
        owner: root
        group: root
        mode: '0644'
      loop:
        - systemd/clamav-scan.service
        - systemd/clamav-update.service

    # ------------------------------------------------------------------
    # SYSTEMD TIMERS
    # ------------------------------------------------------------------
    - name: Installer timers systemd ClamAV
      copy:
        src: "{{ item }}"
        dest: /etc/systemd/system/
        owner: root
        group: root
        mode: '0644'
      loop:
        - systemd/clamav-scan.timer
        - systemd/clamav-update.timer

    # ------------------------------------------------------------------
    # SYSTEMD RELOAD
    # ------------------------------------------------------------------
    - name: Reload systemd
      command: systemctl daemon-reexec

    # ------------------------------------------------------------------
    # SERVICES & TIMERS
    # ------------------------------------------------------------------
    - name: Activer et démarrer ClamAV daemon
      systemd:
        name: clamav-daemon
        enabled: yes
        state: started

    - name: Activer et démarrer les timers ClamAV
      systemd:
        name: "{{ item }}"
        enabled: yes
        state: started
      loop:
        - clamav-scan.timer
        - clamav-update.timer

    # ------------------------------------------------------------------
    # MESSAGE FINAL
    # ------------------------------------------------------------------
    - name: Déploiement terminé
      debug:
        msg: |
          ✅ ClamAV déployé avec succès (systemd timers)

          ⏱ Timers actifs :
            - clamav-scan.timer
            - clamav-update.timer

          🔍 Vérification :
            systemctl list-timers | grep clamav

          ▶ Tests manuels :
            systemctl start clamav-update.service
            systemctl start clamav-scan.service

          📂 Logs :
            - /var/log/clamav/freshclam.log
            - /var/log/clamav/clamav-scan.log
